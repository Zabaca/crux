name: Pull request

# Verification happens before the merge decision, not after it. `main.yml` runs
# the same checks on push to main, but by then the merge is irreversible — and
# for a while that push *was* the first time CI saw the code. This workflow is
# the half that runs while the change is still a proposal.
#
# It runs the same sequence `/release` gates on (`bun run verify`, defined once
# in package.json) and it holds no secrets — but then neither does any workflow
# here, because nothing under `.github/` can deploy at all (ADR-0015). What is
# specific to a pull request is that anyone can open one, so this is the job that
# would matter most if a credential ever were added. Do not add one.
#
# No path filter, for the reason main.yml has none: crux is one Worker
# over one database, so anything that changes the repo can change what ships.

on:
  pull_request:
    branches: [main]

# A superseded push has nothing to say about the head commit, so cancel it.
# (Nothing here applies a schema any more, so there is no half-applied state to
# protect — that hazard moved to `/release`, which is not cancellable by CI.)
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # The doc tree is derived, not committed (ADR-0005), and the Astro pages
      # import it — so a fresh checkout cannot typecheck until it is generated.
      - name: Derive the doc tree
        run: bun run scripts/build-docs.ts

      - name: Verify
        run: bun run verify
